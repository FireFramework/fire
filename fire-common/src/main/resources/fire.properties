# ----------------------------------------------- < HBase 配置 > ----------------------------------------------- #
# 一次读写HBase的数据量
spark.fire.hbase.batch.size                                                         =       10000
# fire框架针对hbase操作后数据集的缓存策略
spark.fire.hbase.storage.level                                                      =       memory_and_disk_ser
# 通过HBase scan后repartition的分区数，需根据scan后的数据量做配置
spark.fire.hbase.scan.partitions                                                    =       -1
# 后续版本会废弃，废弃后spark.fire.hbase.scan.partitions默认值改为1200
spark.fire.hbase.scan.repartitions                                                  =       1200
# 是否开启HBase表存在判断的缓存，开启后表存在判断将避免大量的connection消耗
spark.fire.hbase.table.exists.cache.enable                                          =       true
# 是否开启HBase表存在列表缓存的定时更新任务
spark.fire.hbase.table.exists.cache.reload.enable                                   =       true
# 定时刷新缓存HBase表任务的初始延迟（s）
spark.fire.hbase.table.exists.cache.initialDelay                                    =       60
# 定时刷新缓存HBase表任务的执行频率（s）
spark.fire.hbase.table.exists.cache.period                                          =       600
# 老集群hbase的zk地址（别名：old）
spark.fire.hbase.cluster.map.old                                                    =       hadoop10.zto:2181,hadoop11.zto:2181,hadoop12.zto:2181
# 离线集群hbase的zk地址（别名：batch）
spark.fire.hbase.cluster.map.batch                                                  =       HZPL025041:2181,HZPL025040:2181,HZPL025042:2181,HZPL025039:2181,HZPL025038:2181
# 实时集群hbase的zk地址（别名：streaming）
spark.fire.hbase.cluster.map.streaming                                              =       HZPL025023-hbase-diaochan.ztosys.com:2181,HZPL025024-hbase-diaochan.ztosys.com:2181,HZPL025025-hbase-diaochan.ztosys.com:2181,HZPL025026-hbase-diaochan.ztosys.com:2181,HZPL025027-hbase-diaochan.ztosys.com:2181
# 测试集群hbase的zk地址（别名：test）
spark.fire.hbase.cluster.map.test                                                   =       SHTL009046110:2181,SHTL009046111:2181,SHTL009046109:2181

# hbase connection 配置，约定以：spark.fire.hbase.conf.开头，比如：spark.fire.hbase.conf.hbase.rpc.timeout对应hbase中的配置为hbase.rpc.timeout
spark.fire.hbase.conf.hbase.zookeeper.property.clientPort                           =       2181
spark.fire.hbase.conf.zookeeper.znode.parent                                        =       /hbase
spark.fire.hbase.conf.hbase.rpc.timeout                                             =       600000
spark.fire.hbase.conf.hbase.snapshot.master.timeoutMillis                           =       600000
spark.fire.hbase.conf.hbase.snapshot.region.timeout                                 =       600000

