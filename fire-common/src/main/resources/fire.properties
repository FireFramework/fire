# ----------------------------------------------- < hive 配置 > ------------------------------------------------ #
# 默认的hive数据库
spark.fire.hive.default.database.name                                               =       tmp
# 默认的hive分区字段名称
spark.fire.hive.table.default.partition.name                                        =       ds
# 离线集群hive metastore地址（别名：batch）
