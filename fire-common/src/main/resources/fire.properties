# ******************** 配置文件中所指定的信息会覆盖  GlobalConstants.DefaultVals 中的默认值 ******************** #

# ----------------------------------------------- < fire 配置 > ------------------------------------------------ #
# 当前fire框架的版本号
spark.fire.version                                                                  =       ${project.version}
# fire内置线程池大小
spark.fire.thread.pool.size                                                         =       5
# fire内置定时任务线程池大小
spark.fire.thread.pool.schedule.size                                                =       5
# 是否启用restful服务
spark.fire.rest.enable                                                              =       true
# 用于设置是否做接口校验
spark.fire.rest.filter.enable                                                       =       true
# 是否打印配置信息
spark.fire.conf.show.enable                                                         =       true
# 是否打印restful地址
spark.fire.rest.url.show.enable                                                     =       false
# 是否关闭fire内置的所有累加器
spark.fire.acc.enable                                                               =       true
# 日志累加器开关
spark.fire.acc.log.enable                                                           =       true
# 多值累加器开关
spark.fire.acc.multi.counter.enable                                                 =       true
# 多时间维度累加器开关
spark.fire.acc.multi.timer.enable                                                   =       true
# fire框架埋点日志开关，关闭以后将不再打印埋点日志
spark.fire.log.enable                                                               =       true
# 用于限定fire框架中sql日志的字符串长度
spark.fire.log.sql.length                                                           =       100
# fire框架针对jdbc操作后数据集的缓存策略
spark.fire.jdbc.storage.level                                                       =       memory_and_disk_ser
# 通过JdbcOper查询后将数据集放到多少个分区中，需根据实际的结果集做配置
spark.fire.jdbc.query.partitions                                                    =       10
# 是否启用定时调度
spark.fire.task.schedule.enable                                                     =       true
# 是否启用动态配置
spark.fire.dynamic.conf.enable                                                      =       true
# fire框架rest接口服务最大线程数
spark.fire.restful.max.thread                                                       =       8
# quartz最大线程池大小
spark.fire.quartz.max.thread                                                        =       8
# fire收集日志保留的最多记录数
spark.fire.acc.log.min.size                                                         =       500
# fire收集日志保留的最少记录数
spark.fire.acc.log.max.size                                                         =       1000
# timer累加器保留最大的记录数
spark.fire.acc.timer.max.size                                                       =       1000
# timer累加器清理几小时之前的记录
spark.fire.acc.timer.max.hour                                                       =       12
# env累加器开关
spark.fire.acc.env.enable                                                           =       true
# env累加器保留最多的记录数
spark.fire.acc.env.max.size                                                         =       500
# env累加器保留最少的记录数
spark.fire.acc.env.min.size                                                         =       100
# 定时调度任务黑名单，配置的value为定时任务方法名，多个以逗号分隔
spark.fire.scheduler.blacklist                                                      =
# 是否抛弃zrc独立运行，配置为false表示不向zrc注册，不获取zrc配置
# 配置打印黑名单，包含该配置将不被打印
spark.fire.conf.print.blacklist                                                     =       .map.,pass,secret,zrc,connection,hdfs.ha,print.blacklist,yarn,namenode,metastore,address,redaction
# fire框架restful端口冲突重试次数
spark.fire.restful.port.retry_num                                                   =       3
# fire框架restful端口冲突重试时间（ms）
spark.fire.restful.port.retry_duration                                              =       1000
# 日志的级别，统一前缀为：spark.fire.log.level.conf.
spark.fire.log.level.conf.org.apache.spark                                          =       WARN
spark.fire.log.level.conf.org.apache.kafka                                          =       WARN
spark.fire.log.level.conf.com.zto.fire                                              =       INFO
spark.fire.log.level.conf.org.eclipse.jetty.server                                  =       ERROR
# 是否将配置同步到executor、taskmanager端
spark.fire.deploy_conf.enable                                                       =       true
# 每个jvm实例内部queue用于存放异常对象数最大大小，避免队列过大造成内存溢出
spark.fire.exception_bus.size                                                       =       1000
# 是否开启数据源埋点
spark.fire.buried_point.datasource.enable                                           =       true
# 用于存放埋点的队列最大大小，超过该大小将会被丢弃
spark.fire.buried_point.datasource.max.size                                         =       300


