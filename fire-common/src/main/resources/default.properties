# ******************** 配置文件中所指定的信息会覆盖  GlobalConstants.DefaultVals 中的默认值 ******************** #

# ----------------------------------------------- < fire 配置 > ------------------------------------------------ #
# 当前fire框架的版本号
spark.fire.version                                                                  =       ${project.version}
# 是否启用restful服务
spark.fire.rest.enable                                                              =       true
# 用于设置是否做接口校验
spark.fire.rest.filter.enable                                                       =       true
# 是否关闭fire内置的所有累加器
spark.fire.acc.enable                                                               =       true
# 日志累加器开关
spark.fire.acc.log.enable                                                           =       true
# 多值累加器开关
spark.fire.acc.multi.counter.enable                                                 =       true
# 多时间维度累加器开关
spark.fire.acc.multi.timer.enable                                                   =       true
# fire框架埋点日志开关，关闭以后将不再打印埋点日志
spark.fire.log.enable                                                               =       true
# 用于限定fire框架中sql日志的字符串长度
spark.fire.log.sql.length                                                           =       100
# fire框架针对jdbc操作后数据集的缓存策略
spark.fire.jdbc.storage.level                                                       =       memory_and_disk_ser
# 通过JdbcOper查询后将数据集放到多少个分区中，需根据实际的结果集做配置
spark.fire.jdbc.query.partitions                                                    =       10
# 是否启用定时调度
spark.fire.task.schedule.enable                                                     =       true
# fire框架rest接口服务最大线程数
spark.fire.restful.max.thread                                                       =       8
# quartz最大线程池大小
spark.fire.quartz.max.thread                                                        =       8
# fire收集日志保留的最多记录数
spark.fire.acc.log.min.size                                                         =       500
# fire收集日志保留的最少记录数
spark.fire.acc.log.max.size                                                         =       1000
# timer累加器保留最大的记录数
spark.fire.acc.timer.max.size                                                       =       1000
# timer累加器清理几小时之前的记录
spark.fire.acc.timer.max.hour                                                       =       12
# env累加器开关
spark.fire.acc.env.enable                                                           =       true
# env累加器保留最多的记录数
spark.fire.acc.env.max.size                                                         =       500
# env累加器保留最少的记录数
spark.fire.acc.env.min.size                                                         =       100
# 定时调度任务黑名单，配置的value为定时任务方法名，多个以逗号分隔
spark.fire.scheduler.blacklist                                                      =
# 是否抛弃zrc独立运行，配置为false表示不向zrc注册，不获取zrc配置
# 注：zrc系统异常时可设置为false，不受zrc影响，可正常发布和运行
spark.fire.zrc.enable                                                               =       true
# 配置打印黑名单，包含该配置将不被打印
spark.fire.conf.print.blacklist                                                     =       .map.,pass,zrc,impala.connection.url,hdfs.ha,print.blacklist
# fire框架restful端口冲突重试次数
spark.fire.restful.port.retry_num                                                   =       3
# fire框架restful端口冲突重试时间（ms）
spark.fire.restful.port.retry_duration                                              =       1000
# 默认的spark日志级别
spark.log.level                                                                     =       WARN
# 日志的级别，统一前缀为：spark.log.level.fire_conf.
spark.log.level.fire_conf.org.apache.spark                                          =       WARN
spark.log.level.fire_conf.org.apache.kafka                                          =       WARN
spark.log.level.fire_conf.com.zto.fire                                              =       INFO
spark.log.level.fire_conf.org.eclipse.jetty.server                                  =       ERROR

# ----------------------------------------------- < spark 配置 > ----------------------------------------------- #
# spark的应用名称，为空则取类名
spark.appName                                                                       =
# spark local模式下使用多少core运行，默认为local[*]，自动根据当前pc的cpu核心数设置
spark.local.cores                                                                   =       *
# spark checkpoint目录地址
spark.chkpoint.dir                                                                  =       hdfs://appcluster/user/spark/ckpoint/
# spark streaming批次时间，可覆盖代码中所指定的时间
spark.streaming.batch.duration                                                      =

# ----------------------------------------------- < kafka 配置 > ----------------------------------------------- #
# kafka的groupid，为空则取类名
spark.kafka.group.id                                                                =
# bigdata表示连接大数据的kafka，zms表示连接zms的kafka集群
# spark.kafka.brokers.name                                                          =       bigdata
# topic列表
spark.kafka.topics                                                                  =
# 用于配置启动时的消费位点，默认取最新
spark.kafka.starting.offsets                                                        =       latest
# 数据丢失时执行失败
spark.kafka.failOnDataLoss                                                          =       true
# 是否启用自动commit
spark.kafka.enable.auto.commit                                                      =       false

# kafka集群名称与集群地址映射：spark.kafka.brokers.name=bigdata | spark.kafka.brokers.name=zms
spark.kafka.cluster.map.bigdata                                                     =       192.168.25.80:9092,192.168.25.81:9092,192.168.25.82:9092,192.168.25.129:9092,192.168.25.130:9092,192.168.25.131:9092
spark.kafka.cluster.map.zms                                                         =       192.168.11.101:9092,192.168.11.102:9092,192.168.11.103:9092,192.168.1.173:9092,192.168.5.29:9092,192.168.5.30:9092
spark.kafka.cluster.map.zmsNew                                                      =       192.168.73.31:9092,192.168.73.32:9092,192.168.73.33:9092,192.168.73.34:9092,192.168.73.35:9092,192.168.73.36:9092
spark.kafka.cluster.map.test                                                        =       10.7.68.185:9092,10.7.68.186:9092,10.7.68.188:9092

# 以spark.kafka.conf开头的配置支持所有kafka client的配置
#spark.kafka.conf.session.timeout.ms                                                =       300000
