spark.hbase.cluster.map.batch                                                       =       HZPL025041:2181,HZPL025040:2181,HZPL025042:2181,HZPL025039:2181,HZPL025038:2181
# 实时集群hbase的zk地址（别名：streaming）
spark.hbase.cluster.map.streaming                                                   =       HZPL025024:2181,HZPL025027:2181,HZPL025025:2181,HZPL025023:2181,HZPL025026:2181
# 测试集群hbase的zk地址（别名：test）
spark.hbase.cluster.map.test                                                        =       SHTL009046110:2181,SHTL009046111:2181,SHTL009046109:2181

# hbase connection 配置，约定以：spark.hbase.conf.开头，比如：spark.hbase.conf.hbase.rpc.timeout对应hbase中的配置为hbase.rpc.timeout
spark.hbase.conf.hbase.zookeeper.property.clientPort                                =       2181
spark.hbase.conf.zookeeper.znode.parent                                             =       /hbase
spark.hbase.conf.hbase.rpc.timeout                                                  =       600000
spark.hbase.conf.hbase.snapshot.master.timeoutMillis                                =       600000
spark.hbase.conf.hbase.snapshot.region.timeout                                      =       600000


