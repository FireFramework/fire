#
# Fire API 血缘元数据注册表，所有涉及到 API 的变更均需登记到该配置文件中
# 加载位置：classpath:api-lineage.yaml（与 fire.properties 同目录）
#
# holders      - 声明了 @API 的扩展类，供 ByteBuddy 发现 class.method；加载失败则跳过
# apis 字段说明：
#   name         - API 名称，与 LineageManager.addApiLineage 埋点名一致（唯一）
#   module       - 模块：JDBC / HBase / Streaming 等
#   sinceVersion - 该 API 首次引入的 fire 版本
#   engines      - 适用引擎，缺省为 [spark, flink]
#   changes      - 行为变更史（仅注册表维护，不随运行时血缘 JSON 下发）
#

holders:
  - com.zto.fire.flink.ext.stream.StreamExecutionEnvExt
  - com.zto.fire.flink.ext.stream.DataStreamExt
  - com.zto.fire.flink.ext.stream.TableExt
  - com.zto.fire.flink.ext.provider.JdbcFlinkProvider
  - com.zto.fire.flink.ext.provider.HBaseConnectorProvider
  - com.zto.fire.spark.ext.core.SparkSessionExt
  - com.zto.fire.spark.ext.core.DataFrameExt
  - com.zto.fire.spark.ext.core.DatasetExt
  - com.zto.fire.spark.ext.core.RDDExt
  - com.zto.fire.spark.ext.core.DStreamExt
  - com.zto.fire.spark.ext.core.SQLContextExt
  - com.zto.fire.spark.ext.provider.JdbcSparkProvider
  - com.zto.fire.spark.ext.provider.HBaseConnectorProvider
  - com.zto.fire.spark.ext.provider.HBaseHadoopProvider
  - com.zto.fire.spark.ext.provider.HBaseBulkProvider
  - com.zto.fire.jdbc.JdbcConnectorBridge
  - com.zto.fire.hbase.HBaseFunctions

