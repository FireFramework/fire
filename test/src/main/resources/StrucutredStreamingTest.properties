# ******************** 配置文件中所指定的信息会覆盖 GlobalConstants.DefaultVals 中的默认值 ******************** #

# ------------------ < spark 配置 > ------------------ #
spark.runModel                     =       cluster
spark.chkpoint.dir                 =       hdfs://appcluster/user/spark/ckpoint/
spark.kafka.brokers.url            =       192.168.11.101:9092,192.168.11.102:9092,192.168.11.103:9092
# kafka的topic列表，以逗号分隔
spark.kafka.topics                 =       thrall2, thrall3, thrall4, thrall5, thrall6, thrall7, thrall8, thrall9
spark.kafka.starting.offsets       =       latest
spark.kafka.failOnDataLoss         =       true
spark.log.level                    =       ERROR
spark.default.database.name        =       tmp
spark.default.table.partition.name =       ds

# ------------------- < hive 配置 > ------------------- #
# hive metastore地址，用于spark跨集群读取hive元数据信息
hive.metastore.uris                =       thrift://192.168.25.180:9083

# ------------------- < hbase 配置 > ------------------- #
# 用于区分不同的hbase集群: batch/streaming/old
hbase.name                         =       batch

# ------------------ < impala 配置 > ------------------ #
impala.connection.url              =      jdbc:hive2://192.168.25.37:21050/;auth=noSasl
impala.jdbc.driver.class.name      =      org.apache.hive.jdbc.HiveDriver

# ---------------- < carbondata 配置 > ---------------- #
carbon.storePath                   =      hdfs://appcluster/user/CarbonStore
carbon.metaStorePath               =

