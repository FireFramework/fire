spark.fire.zrc.enable=false
spark.log.level=INFO
spark.hive.cluster=test
spark.streaming.batch.duration=60
# 非必须配置项：默认是大数据的rocket地址
spark.rocket.brokers.name=192.168.1.169:9876;192.168.1.170:9876
spark.rocket.consumer.tag=*
# 必须配置项：rocket的topic列表，以逗号分隔
spark.rocket.topics=sjzn_spark_online_service_topic
# 非必须配置项：默认为appName
spark.rocket.group.id=BoardOnlineDataToDb
spark.rocket.pull.max.speed.per.partition=2000