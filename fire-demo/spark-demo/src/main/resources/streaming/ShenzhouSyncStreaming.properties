# 非必须配置项：spark 任务的appName，不配置则取类名
# spark.appName                      =       test
spark.log.level                    =       ERROR
# 非必须配置项：默认就是这个地址
spark.kafka.brokers.name           =       zms
# 必须配置项：kafka的topic列表，以逗号分隔
spark.kafka.topics                 =       thrall2, thrall3, thrall4, thrall5, thrall6, thrall7, thrall8, thrall9
# 非必须配置项：默认为appName
spark.kafka.group.id               =       shenzhouSyncStreaming6
# 仅用于本地测试，线上任务请移除该配置
spark.io.compression.codec          =       snappy

# ------------------- < hbase 配置 > ------------------- #
# 用于区分不同的hbase集群: batch/streaming/old
spark.hbase.cluster                      =       streaming

# spark的参数可以直接写在下面，都会被加载，覆盖程序中默认的配置信息
spark.speculation                  =       false
spark.streaming.concurrentJobs     =       1