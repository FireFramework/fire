# 非必须配置项：spark 任务的appName，不配置则取类名
# spark.appName                    =       test
spark.log.level                    =       INFO
spark.streaming.batch.duration     =       10

# 非必须配置项：默认是大数据的rocket地址
spark.rocket.brokers.name          =       192.168.27.127:9876;192.168.27.128:9876
# 必须配置项：rocket的topic列表，以逗号分隔
spark.rocket.topics                =       cj_pg_bill_item_topic
# 非必须配置项：默认为appName
spark.rocket.group.id              =       fire
# 用于配置启动时的消费位点，默认取最新
spark.rocket.starting.offsets      =       latest
spark.rocket.consumer.tag          =       *

spark.rocket.brokers.name2          =       192.168.27.127:9876;192.168.27.128:9876
# 必须配置项：rocket的topic列表，以逗号分隔
spark.rocket.topics2                =       cj_pg_bill_event_topic
# 非必须配置项：默认为appName
spark.rocket.group.id2              =       fire2
# 用于配置启动时的消费位点，默认取最新
spark.rocket.starting.offsets2      =       latest
spark.rocket.consumer.tag2          =       *

# 数据丢失时执行失败
spark.rocket.failOnDataLoss        =       true
spark.rocket.enable.auto.commit    =       false