# 非必须配置项：spark 任务的appName，不配置则取类名
spark.appName                      =       HBaseOperTest
spark.log.level                    =       info
# ------------------- < hbase 配置 > ------------------- #
# 用于区分不同的hbase集群: batch/streaming/old
spark.hbase.cluster                =       streaming
spark.hive.support.enable          =       false
spark.fire.hbase.scan.repartitions =       3
spark.fire.hbase.storage.level     =       memory_only