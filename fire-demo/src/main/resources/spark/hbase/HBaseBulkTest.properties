# 非必须配置项：spark 任务的appName，不配置则取类名
spark.appName                      =       HBaseBulkTest
spark.log.level                    =       ERROR
# ------------------- < hbase 配置 > ------------------- #
# 用于区分不同的hbase集群: batch/streaming/old
spark.hbase.cluster                =       streaming
# 仅用于本地测试，线上任务请移除该配置
spark.io.compression.codec          =       snappy