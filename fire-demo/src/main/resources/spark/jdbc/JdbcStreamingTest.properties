# 非必须配置项：spark 任务的appName，不配置则取类名
# spark.appName                    =       test
spark.log.level                    =       INFO
# 非必须配置项：默认是大数据的kafka地址，如果连zms，则将bigdata替换为zms
spark.kafka.brokers.name           =       bigdata
# 必须配置项：kafka的topic列表，以逗号分隔
spark.kafka.topics                 =       aries_binlog_order
# 非必须配置项：默认为appName
spark.kafka.group.id               =       fire
# 仅用于本地测试，线上任务请移除该配置
spark.io.compression.codec          =       snappy

