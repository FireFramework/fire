# 非必须配置项：默认就是这个地址
spark.kafka.brokers.name            =       zms
# 必须配置项：kafka的topic列表，以逗号分隔
spark.kafka.topics                  =       aries_binlog_preorder
# 非必须配置项：默认为appName
spark.kafka.group.id                =       fire
spark.fire.rest.filter.enable       =       false
spark.hbase.cluster                 =       streaming