spark.log.level                    =       INFO
# 非必须配置项：默认就是这个地址
spark.kafka.brokers.name           =       zmsNew
# 必须配置项：kafka的topic列表，以逗号分隔
spark.kafka.topics                 =       sjzn_spark_order_unique_topic
# 非必须配置项：默认为appName
spark.kafka.group.id               =       fire

# ------------------- < hbase 配置 > ------------------- #
# 用于区分不同的hbase集群: batch/streaming/old
spark.hbase.cluster                =       streaming
spark.hive.cluster                 =       streaming

# spark的参数可以直接写在下面，都会被加载，覆盖程序中默认的配置信息
spark.speculation                  =       false
spark.streaming.concurrentJobs     =       1

# fire收集日志保留的最大记录数
spark.fire.acc.log.max.size         =       2000
spark.fire.acc.timer.max.size       =       2000
spark.fire.acc.timer.max.hour       =       6

